name: Release verified cx binaries

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: cx-cli-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 两个 job 分权：build 跑依赖代码（bun install / 测试 / 构建）但只有只读令牌；
  # publish 持有 contents:write 但不 checkout、不装依赖、不跑仓库代码。
  # 同一 job 里只把 GH_TOKEN 收窄到 gh 步骤不够：前面步骤的依赖代码可经 $GITHUB_PATH 伪造 gh、
  # 或经 $GITHUB_ENV 设 BASH_ENV，在带令牌的步骤里执行。
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      # 第三方 action 固定到 commit SHA（tag 可被改写）；升级时同步更新注释里的版本
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Verify tag, package version and provenance
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          test "v${VERSION}" = "$RELEASE_TAG"
          test -s source-commit.txt
          # 只发布已进入 main 的提交：其他分支上的 tag 不得成为安装器默认拉取的 Latest
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install, typecheck, test and build six verified assets
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run package:release

      - name: Verify manifest, SHA256SUMS and asset allowlist
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
          const pkg = require('./package.json');
          const expected = [
            'cx-darwin-arm64', 'cx-darwin-x64',
            'cx-linux-arm64', 'cx-linux-x64',
            'cx-windows-arm64.exe', 'cx-windows-x64.exe',
          ];
          if (manifest.version !== pkg.version) throw new Error('manifest version mismatch');
          if (manifest.sourceCommit !== fs.readFileSync('source-commit.txt', 'utf8').trim()) throw new Error('source commit mismatch');
          const actual = manifest.assets.map((asset) => asset.name).sort();
          if (JSON.stringify(actual) !== JSON.stringify([...expected].sort())) throw new Error(`asset allowlist mismatch: ${actual}`);
          const hashes = new Map();
          for (const asset of manifest.assets) {
            const bytes = fs.readFileSync(`dist/${asset.name}`);
            const sha = crypto.createHash('sha256').update(bytes).digest('hex');
            if (sha !== asset.sha256) throw new Error(`sha256 mismatch: ${asset.name}`);
            hashes.set(asset.name, sha);
          }
          // 安装器实际消费的是 SHA256SUMS：逐行核对内容且每个资产恰好一行（重复一行 + 删一行不能蒙混过关）
          const sums = fs.readFileSync('dist/SHA256SUMS', 'utf8').trim().split('\n');
          const seen = new Set();
          for (const line of sums) {
            const m = line.match(/^([a-f0-9]{64})  (\S+)$/);
            if (!m || hashes.get(m[2]) !== m[1]) throw new Error(`SHA256SUMS entry mismatch: ${line}`);
            if (seen.has(m[2])) throw new Error(`SHA256SUMS duplicate entry: ${m[2]}`);
            seen.add(m[2]);
          }
          if (seen.size !== expected.length || sums.length !== expected.length) throw new Error('SHA256SUMS asset count mismatch');
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist/cx-darwin-arm64
            dist/cx-darwin-x64
            dist/cx-linux-arm64
            dist/cx-linux-x64
            dist/cx-windows-arm64.exe
            dist/cx-windows-x64.exe
            dist/manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist

      - name: Re-verify SHA256SUMS against downloaded assets
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --strict -c SHA256SUMS
          EXPECTED="$(printf '%s\n' cx-darwin-arm64 cx-darwin-x64 cx-linux-arm64 cx-linux-x64 cx-windows-arm64.exe cx-windows-x64.exe | sort)"
          test "$(awk '{print $2}' SHA256SUMS | sort)" = "$EXPECTED"

      - name: Create draft release with allowlisted assets only
        run: |
          gh release create "$RELEASE_TAG" \
            dist/cx-darwin-arm64 dist/cx-darwin-x64 \
            dist/cx-linux-arm64 dist/cx-linux-x64 \
            dist/cx-windows-arm64.exe dist/cx-windows-x64.exe \
            dist/manifest.json dist/SHA256SUMS \
            --verify-tag --draft --title "cx ${RELEASE_TAG}" --generate-notes

      - name: Verify draft assets and publish
        run: |
          set -euo pipefail
          EXPECTED="$(printf '%s\n' SHA256SUMS manifest.json cx-darwin-arm64 cx-darwin-x64 cx-linux-arm64 cx-linux-x64 cx-windows-arm64.exe cx-windows-x64.exe | sort)"
          ACTUAL="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          # 仅当本 tag 是语义化版本最高者才标记 Latest：旧版本线的补丁 tag 不得让安装器降级
          HIGHEST="$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | { cat; echo "$RELEASE_TAG"; } | sort -V | tail -1)"
          if [ "$HIGHEST" = "$RELEASE_TAG" ]; then LATEST=true; else LATEST=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$LATEST"
